# ============================================================================
# Exoskeleton/compose.yaml
# ============================================================================
# Headless GitHub CLI Agent (autonomous) — the agent process, nothing else.
#
# Networking is deliberately NOT defined here. The bridge network, Kiri
# domains, published ports and the nginx dashboard belong to the Edge
# Computing repository:
#
#   ingeniosity-A2A/MA-Edge-Computing → ops/network/exoskeleton-agent/
#     compose.override.yaml   (network, labels, ports, dashboard)
#     README.md               (how to apply it)
#
# Without that override this file starts the agent on loopback only: no
# published port, no custom network, healthcheck answered inside the
# container.
#
# Usage (agent only):
#   export GH_TOKEN=...          # required: headless gh auth
#   docker compose up -d
#   docker compose logs -f agent
#   docker compose exec agent curl -fsS localhost:9090/status
#   docker compose down
#
# ── About the DuckDB index ──────────────────────────────────────────────────
# DuckDB is an embedded, single-writer library, not a network server. Its
# official image (duckdb/duckdb:2.0.0 on Docker Hub, distroless) is the CLI
# only: no HTTP listener, no 9999 port, no /health endpoint, so a
# `depends_on: service_healthy` on it can never succeed. A pinned
# ghcr.io/duckdb/duckdb image does not exist either.
#
# The index is therefore owned by the agent process that opens it, exactly as
# gh_headless_agent.py does with duckdb.connect(). The committed .db stays the
# source of truth and INDEX.md remains a render of it. A separate DB process
# would need DuckDB's Quack remote protocol (beta as of 1.5.2, targeting 2.0),
# not an HTTP sidecar on the CLI image.
# ============================================================================

services:

  # ── Headless GitHub CLI Agent ──────────────────────────────────────────
  # Autonomous: indexes dependencies into DuckDB, queries GitHub, renders
  # INDEX.md. restart: unless-stopped is the self-healing half.
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: exoskeleton/headless-github-cli-agent:0.1.0
    container_name: exoskeleton-github-agent
    restart: unless-stopped
    environment:
      # ── GitHub CLI headless config ──────────────────────────────────
      GH_TOKEN: "${GH_TOKEN:?Set GH_TOKEN before starting}"
      GH_PROMPT_DISABLED: "true"
      GH_NO_UPDATE_NOTIFIER: "true"
      NO_COLOR: "1"
      GIT_TERMINAL_PROMPT: "0"

      # ── Agent config ────────────────────────────────────────────────
      AGENT_MODE: "autonomous"
      AGENT_POLL_INTERVAL: "300"     # 5 minutes between autonomous cycles
      AGENT_AUTO_VERIFY: "true"
      AGENT_AUTO_RENDER: "true"
      AGENT_SELF_HEAL: "true"
      AGENT_LOG_LEVEL: "info"

      # ── Dependency index (DuckDB file, not a server) ────────────────
      DUCKDB_PATH: "/workspace/Dependencies/dependency_index.db"
      SCHEMA_PATH: "/workspace/Memory/schemas/dependency_index.sql"
      INDEX_PATH: "/workspace/INDEX.md"

      # ── Host-aware routing ──────────────────────────────────────────
      HOST_PROFILE: "${HOST_PROFILE:-any}"
    volumes:
      # The index and its render are repo state: write them back to the repo.
      - .:/workspace
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
