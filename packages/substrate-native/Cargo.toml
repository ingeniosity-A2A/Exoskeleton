[package]
name = "exoskeleton-substrate-native"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Layer 0 lock-free SharedVectorMailbox for Ava-007 / Exoskeleton"

[lib]
name = "exoskeleton_substrate_native"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# RyanCodrai TurboVec — pinned release; opt-in until target builds are verified.
turbovec = { version = "=1.1.2", optional = true }

[features]
default = []
turbovec = ["dep:turbovec"]

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
